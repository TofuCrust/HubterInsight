# Isi aplikasi yang dilayani Nginx (dipakai di mode HTTP maupun HTTPS).
# Variabel + resolver Docker membuat Nginx tetap bisa start walau container
# aplikasi belum/sedang restart (tidak error "host not found").

resolver 127.0.0.11 valid=10s;

# Chat (SSE): dibatasi lajunya per IP dan ukuran body-nya
location = /api/chat {
    limit_req zone=api burst=20 nodelay;
    client_max_body_size 64k;

    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_buffering off;        # wajib agar jawaban AI mengalir (streaming)
    proxy_cache off;
    gzip off;
    proxy_read_timeout 300s;
}

# Login: dibatasi lajunya per IP (tebakan kata sandi) dan ukuran body-nya
location = /api/login {
    limit_req zone=api burst=5 nodelay;
    client_max_body_size 4k;

    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

# Dokumen (halaman Dokumen): daftar dan unggah; body unggahan hingga 30 MB
location = /api/files {
    limit_req zone=api burst=10 nodelay;
    client_max_body_size 30m;

    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
}

# Endpoint API lain (health, config, session, logout)
location /api/ {
    set $backend http://backend:8000;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
}

# Frontend (berkas statis)
location / {
    set $frontend http://frontend:80;
    proxy_pass $frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
