name: hubter-insight

services:
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?Isi DOMAIN di file .env}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/entrypoint.d/40-select-mode.sh:/docker-entrypoint.d/40-select-mode.sh:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      LLM_MODE: ${LLM_MODE:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-low}
      SEARCH_MODE: ${SEARCH_MODE:-bm25}
      AGENTIC: ${AGENTIC:-0}
      DOC_STATUS: ${DOC_STATUS:-1}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      RATE_LIMIT_PER_DAY: ${RATE_LIMIT_PER_DAY:-300}
      DAILY_REQUEST_CAP: ${DAILY_REQUEST_CAP:-600}
      LOGIN_RATE_PER_MINUTE: ${LOGIN_RATE_PER_MINUTE:-30}
      LOGIN_RATE_PER_DAY: ${LOGIN_RATE_PER_DAY:-500}
      AUTH_USER: ${AUTH_USER:-hubter}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      LOG_DB_PATH: /data/hubter.db
      UPLOAD_DIR: /uploads
      EMBEDDINGS_PATH: /data/embeddings.npz
    volumes:
      - hubter-data:/data
      - ./uploads:/uploads  # dokumen unggahan (halaman Dokumen); bisa dibaca langsung di VPS
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped

  # Memperbarui sertifikat otomatis (cek tiap 12 jam, hanya memperbarui bila < 30 hari sebelum kedaluwarsa).
  # Penerbitan pertama dilakukan lewat scripts/init-ssl.sh.
  certbot:
    image: certbot/certbot:v4.2.0
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'

volumes:
  hubter-data:
  certbot-etc:
  certbot-www:
